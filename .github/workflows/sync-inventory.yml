name: Sync inventory

on:
  schedule:
    # Every 4 hours. GitHub runs this in UTC and may delay it slightly.
    - cron: '0 */4 * * *'
  workflow_dispatch:

# contents: write pushes the snapshot. pages + id-token are required so this
# workflow can call deploy.yml. A push made with the default token does not
# start the push-triggered Pages workflow, so the deploy job is invoked here.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-inventory
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Sync inventory from the public mobile.de page
        run: npm run inventory:sync

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Typecheck
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path && format('{0}/', steps.pages.outputs.base_path) || '/' }}
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
          PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
          PUBLIC_INDEXABLE: ${{ vars.PUBLIC_INDEXABLE }}

      - name: Verify build output
        run: npm run verify
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path && format('{0}/', steps.pages.outputs.base_path) || '/' }}

      - name: Commit inventory when it changed
        id: commit
        run: |
          if git diff --quiet -- src/data/inventory.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "Inventory is already current. No commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/inventory.json
          git commit -m "Sync vehicle inventory from mobile.de."
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.sync.outputs.sha }}
    secrets: inherit
